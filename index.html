<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lara IA</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
      height: 100vh;
      overflow: hidden;
    }

    #camera {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .top {
      position: fixed;
      top: 0;
      width: 100%;
      padding: 22px;
      background: linear-gradient(#000d, transparent);
      z-index: 2;
    }

    .title {
      font-size: 27px;
      font-weight: bold;
    }

    .status {
      color: #00ff88;
      margin-top: 4px;
      font-size: 14px;
    }

    .scanner {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 75%;
      height: 42%;
      transform: translate(-50%, -50%);
      border: 2px solid #00ff88;
      border-radius: 20px;
      pointer-events: none;
    }

    .resultado {
      position: fixed;
      bottom: 20px;
      left: 5%;
      width: 90%;
      padding: 16px;
      background: #000d;
      backdrop-filter: blur(8px);
      border-radius: 18px;
      z-index: 3;
    }

    .resultado h2 {
      font-size: 18px;
      margin-bottom: 7px;
    }

    .resultado p {
      color: #ccc;
      line-height: 1.35;
    }

    canvas {
      display: none;
    }
  </style>
</head>

<body>

<video id="camera" autoplay playsinline></video>

<div class="top">
  <div class="title">LARA IA</div>
  <div class="status" id="estado">● Iniciando...</div>
</div>

<div class="scanner"></div>

<div class="resultado">
  <h2 id="titulo">🧠 Lara</h2>
  <p id="texto">Iniciando cámara...</p>
</div>

<canvas id="captura"></canvas>

<script>

const camera = document.getElementById("camera");
const canvas = document.getElementById("captura");
const contexto = canvas.getContext("2d");

let analizando = false;


// ==============================
// CÁMARA
// ==============================

async function iniciarCamara() {

  try {

    const stream =
      await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: "environment",
          width: {
            ideal: 640
          },
          height: {
            ideal: 480
          }
        },
        audio: false
      });

    camera.srcObject = stream;

    document.getElementById("estado").textContent =
      "● Lara está observando";

    camera.onloadeddata = () => {
      analizarAutomaticamente();
    };

  } catch (error) {

    console.error(error);

    document.getElementById("estado").textContent =
      "● Error de cámara";

    document.getElementById("texto").textContent =
      "Permite el acceso a la cámara.";

  }

}


// ==============================
// CAPTURA PEQUEÑA
// ==============================

function capturarImagen() {

  if (!camera.videoWidth) {
    return null;
  }

  const ancho = 480;
  const alto =
    Math.round(
      camera.videoHeight *
      (ancho / camera.videoWidth)
    );

  canvas.width = ancho;
  canvas.height = alto;

  contexto.drawImage(
    camera,
    0,
    0,
    ancho,
    alto
  );

  // Calidad 0.45 = imagen más pequeña
  return canvas.toDataURL(
    "image/jpeg",
    0.45
  );

}


// ==============================
// ANÁLISIS
// ==============================

async function analizarAutomaticamente() {

  // Espera 4 segundos antes del primer análisis
  await esperar(4000);

  while (true) {

    if (!analizando) {

      const imagen =
        capturarImagen();

      if (imagen) {

        await analizarConLara(
          imagen
        );

      }

    }

    // Espera 7 segundos entre análisis
    await esperar(7000);

  }

}


// ==============================
// CONECTAR CON GEMINI
// ==============================

async function analizarConLara(imagen) {

  analizando = true;

  document.getElementById("titulo").textContent =
    "🔍 Lara está analizando...";

  try {

    const respuesta =
      await fetch(
        "http://127.0.0.1:3000/analizar",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            imagen: imagen
          })

        }
      );


    const datos =
      await respuesta.json();


    if (!respuesta.ok) {

      throw new Error(
        datos.error ||
        "Error del servidor"
      );

    }


    document.getElementById("titulo").textContent =
      "🧠 Lara";

    document.getElementById("texto").textContent =
      datos.resultado ||
      "No encontré nada.";

  }

  catch (error) {

    console.error(error);

    document.getElementById("titulo").textContent =
      "❌ Error";

    document.getElementById("texto").textContent =
      "No pude comunicarme con Lara.";

  }

  analizando = false;

}


// ==============================
// ESPERAR
// ==============================

function esperar(ms) {

  return new Promise(
    resolve => setTimeout(
      resolve,
      ms
    )
  );

}


// ==============================
// INICIAR
// ==============================

iniciarCamara();

</script>

</body>
</html>
